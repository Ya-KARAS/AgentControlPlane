name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-matrix:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  # Branch protection requires a check named exactly "test". The matrix
  # checks keep the names "test (ubuntu-latest)" and "test (windows-latest)".
  test:
    name: test
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix result
        run: |
          result="${{ needs.test-matrix.result }}"
          echo "matrix result: $result"
          if [ "$result" != "success" ]; then
            exit 1
          fi
